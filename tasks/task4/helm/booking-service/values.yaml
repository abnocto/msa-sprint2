image:
  name: booking-service
  tag: latest

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# liveness
livenessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 3

# readiness
readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  periodSeconds: 5
  failureThreshold: 2
